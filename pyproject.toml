[build-system]
requires = ["pbr>=7.1.0"]
build-backend = "pbr.build"

[project]
name = "neutron-lib"
description = "Neutron shared routines and utilities"
authors = [
    {name = "OpenStack", email = "openstack-discuss@lists.openstack.org"},
]
readme = {file = "README.rst", content-type = "text/x-rst"}
license = "Apache-2.0"
dynamic = ["version"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: OpenStack",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    # Requirements lower bounds listed here are our best effort to keep them
    # up to date but we do not test them so no guarantee of having them all
    # correct. If you find any incorrect lower bounds, let us know or propose
    # a fix.
    "coverage>=4.0", # Apache-2.0
    "debtcollector>=3.0.0", # Apache-2.0
    "keystoneauth1>=3.14.0", # Apache-2.0
    "netaddr>=0.7.18", # BSD
    "os-ken>=0.3.0", # Apache-2.0
    "oslo.concurrency>=3.26.0", # Apache-2.0
    "oslo.config>=8.0.0", # Apache-2.0
    "oslo.context>=2.22.0", # Apache-2.0
    "oslo.db>=12.1.0", # Apache-2.0
    "oslo.i18n>=3.20.0", # Apache-2.0
    "oslo.log>=4.3.0", # Apache-2.0
    "oslo.messaging>=14.2.0", # Apache-2.0
    "oslo.policy>=6.0.0", # Apache-2.0
    "oslo.serialization>=2.25.0", # Apache-2.0
    "oslo.service>=1.24.0", # Apache-2.0
    "oslo.utils>=7.0.0", # Apache-2.0
    "oslo.versionedobjects>=1.31.2", # Apache-2.0
    "osprofiler>=1.4.0", # Apache-2.0
    "os-traits>=0.9.0", # Apache-2.0
    "pbr>=4.0.0", # Apache-2.0
    "pecan>=1.0.0", # BSD
    "setproctitle>=1.1.10", # BSD
    "SQLAlchemy>=2.0.5", # MIT
    "stevedore>=5.6.0", # Apache-2.0
    "WebOb>=1.7.1", # MIT
]

[project.urls]
"Bug Tracker" = "https://bugs.launchpad.net/neutron"
"Documentation" = "https://docs.openstack.org/neutron-lib"
"Source Code" = "https://opendev.org/openstack/neutron-lib"

[project.entry-points."oslo.policy.enforcer"]
neutron_lib = "neutron_lib._policy:get_enforcer"

[project.entry-points."oslo.policy.policies"]
neutron_lib = "neutron_lib._policy:list_rules"

[project.entry-points."flake8.extension"]
N521 = "neutron_lib.hacking.checks:use_jsonutils"
N529 = "neutron_lib.hacking.checks:no_mutable_default_args"
N530 = "neutron_lib.hacking.checks:check_neutron_namespace_imports"
N532 = "neutron_lib.hacking.translation_checks:check_log_warn_deprecated"
N534 = "neutron_lib.hacking.translation_checks:check_raised_localized_exceptions"
N536 = "neutron_lib.hacking.checks:assert_equal_none"
N537 = "neutron_lib.hacking.translation_checks:no_translate_logs"
N535 = "neutron_lib.hacking.checks:check_no_eventlet_imports"

[dependency-groups]
dev = [
    {include-group = "doc"},
    {include-group = "test"},
    {include-group = "types"},
]
doc = [
    "openstackdocstheme>=2.2.1", # Apache-2.0
    "os-api-ref>=1.4.0", # Apache-2.0
    "reno>=3.1.0", # Apache-2.0
    "sphinx>=2.0.0", # BSD
]
test = [
    "fixtures>=3.0.0", # Apache-2.0/BSD
    "hacking>=8.1.0,<=8.2.0", # Apache-2.0
    "oslotest>=3.2.0", # Apache-2.0
    "stestr>=1.0.0", # Apache-2.0
    "testtools>=2.2.0", # MIT
]
types = [
    "mypy",
    "types-PySocks", # Apache-2.0
    "types-PyYAML", # Apache-2.0
    "types-WebOb", # Apache-2.0
    "types-greenlet", # Apache-2.0
    "types-netaddr", # Apache-2.0
    "types-psutil", # Apache-2.0
    "types-python-dateutil", # Apache-2.0
    "types-simplejson", # Apache-2.0
    "types-uWSGI", # Apache-2.0
]

[tool.setuptools.packages.find]
include = ["neutron_lib*"]

[tool.mypy]
python_version = "3.11"
incremental = true
pretty = true
show_error_context = true
show_column_numbers = true
follow_imports = "normal"
disallow_incomplete_defs = true
warn_unused_ignores = true
# remove gradually as progress is made
disable_error_code = "import-untyped,var-annotated"

# Modules listed here are fully annotated; keep it that way. Add a module (or
# package glob) once it passes, and never remove one. Once everything outside
# the tests is listed, move these options to the global section.
[[tool.mypy.overrides]]
module = [
    "neutron_lib.api.definitions.*",
    "neutron_lib.plugins.ml2.api",
]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "neutron_lib.plugins.ml2.api",
]
disallow_any_generics = true

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["C90", "E", "F", "G", "S", "UP", "W"]
preview = true
ignore = [
    "S104",  # Possible binding to all interfaces
    "S311",  # Suspicious non-cryptographic random usage
    "UP031", # Use format specifiers instead of percent format
]

[tool.ruff.lint.per-file-ignores]
"neutron_lib/tests/*" = ["S"]

[tool.ruff.lint.mccabe]
max-complexity = 16
